# .github/workflows/lfs-build.yml
#
# Sıfırdan Linux (LFS 12.3 yöntemi):
#   Mimari   : x86_64
#   libc     : glibc 2.41, araçlar: GNU (binutils, gcc, coreutils, bash ...)
#   init     : sysvinit + OpenRC (systemd yok)
#   paket yön.: xbps (Void Linux'un paket yöneticisi)
#   Çekirdek : Linux 6.13.4 (defconfig + kvm_guest, modülsüz)
#
# Aşamalar: sources -> toolchain -> temp-tools -> final (chroot) -> image (+kernel)
# Her aşama ayrı job (6 saat limiti için), aralarında artifact taşınır.

name: Build Linux From Scratch

on:
  workflow_dispatch:
    inputs:
      image_size:
        description: "Disk imajı boyutu (örn. 4G)"
        default: "4G"
        type: string
      root_password:
        description: "root şifresi (varsayılanı mutlaka değiştir)"
        default: "root"
        type: string
      run_qemu_test:
        description: "Imajı QEMU'da boot edip login: promptunu bekle"
        default: true
        type: boolean
      create_release:
        description: "GitHub Release oluştur"
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  LFS: /mnt/lfs
  LFS_TGT: x86_64-lfs-linux-gnu
  SRC: /mnt/src

jobs:
  # ---------------------------------------------------------------- 1) kaynaklar
  sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Kaynak kodları indir
        run: |
          sudo mkdir -p /mnt/src
          sudo chown "$USER" /mnt/src
          cd /mnt/src
          cat > urls.txt <<'EOF'
          binutils-2.44.tar.xz https://ftp.gnu.org/gnu/binutils/binutils-2.44.tar.xz
          gcc-14.2.0.tar.xz https://ftp.gnu.org/gnu/gcc/gcc-14.2.0/gcc-14.2.0.tar.xz
          gmp-6.3.0.tar.xz https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz
          mpfr-4.2.1.tar.xz https://ftp.gnu.org/gnu/mpfr/mpfr-4.2.1.tar.xz
          mpc-1.3.1.tar.gz https://ftp.gnu.org/gnu/mpc/mpc-1.3.1.tar.gz
          linux-6.13.4.tar.xz https://www.kernel.org/pub/linux/kernel/v6.x/linux-6.13.4.tar.xz
          glibc-2.41.tar.xz https://ftp.gnu.org/gnu/glibc/glibc-2.41.tar.xz
          m4-1.4.19.tar.xz https://ftp.gnu.org/gnu/m4/m4-1.4.19.tar.xz
          ncurses-6.5.tar.gz https://ftp.gnu.org/gnu/ncurses/ncurses-6.5.tar.gz
          bash-5.2.37.tar.gz https://ftp.gnu.org/gnu/bash/bash-5.2.37.tar.gz
          coreutils-9.6.tar.xz https://ftp.gnu.org/gnu/coreutils/coreutils-9.6.tar.xz
          diffutils-3.11.tar.xz https://ftp.gnu.org/gnu/diffutils/diffutils-3.11.tar.xz
          file-5.46.tar.gz https://astron.com/pub/file/file-5.46.tar.gz
          findutils-4.10.0.tar.xz https://ftp.gnu.org/gnu/findutils/findutils-4.10.0.tar.xz
          gawk-5.3.1.tar.xz https://ftp.gnu.org/gnu/gawk/gawk-5.3.1.tar.xz
          grep-3.11.tar.xz https://ftp.gnu.org/gnu/grep/grep-3.11.tar.xz
          gzip-1.13.tar.xz https://ftp.gnu.org/gnu/gzip/gzip-1.13.tar.xz
          make-4.4.1.tar.gz https://ftp.gnu.org/gnu/make/make-4.4.1.tar.gz
          patch-2.7.6.tar.xz https://ftp.gnu.org/gnu/patch/patch-2.7.6.tar.xz
          sed-4.9.tar.xz https://ftp.gnu.org/gnu/sed/sed-4.9.tar.xz
          tar-1.35.tar.xz https://ftp.gnu.org/gnu/tar/tar-1.35.tar.xz
          xz-5.6.4.tar.xz https://github.com/tukaani-project/xz/releases/download/v5.6.4/xz-5.6.4.tar.xz
          perl-5.40.1.tar.xz https://www.cpan.org/src/5.0/perl-5.40.1.tar.xz
          pkgconf-2.3.0.tar.xz https://distfiles.ariadne.space/pkgconf/pkgconf-2.3.0.tar.xz
          zlib-1.3.1.tar.xz https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.xz
          zstd-1.5.7.tar.gz https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz
          libxcrypt-4.4.38.tar.xz https://github.com/besser82/libxcrypt/releases/download/v4.4.38/libxcrypt-4.4.38.tar.xz
          libressl-3.9.2.tar.gz https://cdn.openbsd.org/pub/OpenBSD/LibreSSL/libressl-3.9.2.tar.gz
          libarchive-3.7.7.tar.xz https://github.com/libarchive/libarchive/releases/download/v3.7.7/libarchive-3.7.7.tar.xz
          xbps-0.59.2.tar.gz https://github.com/void-linux/xbps/archive/refs/tags/0.59.2.tar.gz
          util-linux-2.40.4.tar.xz https://www.kernel.org/pub/linux/utils/util-linux/v2.40/util-linux-2.40.4.tar.xz
          e2fsprogs-1.47.2.tar.xz https://www.kernel.org/pub/linux/kernel/people/tytso/e2fsprogs/v1.47.2/e2fsprogs-1.47.2.tar.xz
          shadow-4.17.3.tar.xz https://github.com/shadow-maint/shadow/releases/download/4.17.3/shadow-4.17.3.tar.xz
          procps-ng-4.0.5.tar.xz https://sourceforge.net/projects/procps-ng/files/Production/procps-ng-4.0.5.tar.xz
          sysvinit-3.14.tar.xz https://github.com/slicer69/sysvinit/releases/download/3.14/sysvinit-3.14.tar.xz
          openrc-0.45.2.tar.gz https://github.com/OpenRC/openrc/archive/refs/tags/0.45.2.tar.gz
          dhcpcd-10.1.0.tar.xz https://github.com/NetworkConfiguration/dhcpcd/releases/download/v10.1.0/dhcpcd-10.1.0.tar.xz
          inetutils-2.6.tar.xz https://ftp.gnu.org/gnu/inetutils/inetutils-2.6.tar.xz
          nano-8.3.tar.xz https://ftp.gnu.org/gnu/nano/nano-8.3.tar.xz
          EOF
          while read -r name url; do
            [ -z "$name" ] && continue
            echo ">> $name"
            curl -fL --retry 5 --retry-delay 5 -sS -o "$name" "$url"
          done < urls.txt

          cat > helpers.sh <<'EOF'
          export LFS=/mnt/lfs
          export LFS_TGT=x86_64-lfs-linux-gnu
          export SRC=/mnt/src
          export LC_ALL=POSIX
          export PATH="$LFS/tools/bin:$PATH"
          export CONFIG_SITE=$LFS/usr/etc/config.site
          export MAKEFLAGS="-j$(nproc)"
          umask 022
          # unpack <isim-surum> : /mnt/build altında temiz açar ve içine girer
          unpack() {
            local f
            f=$(ls "$SRC"/$1.tar.* | head -n1)
            mkdir -p /mnt/build
            find /mnt/build -mindepth 1 -delete
            tar -xf "$f" -C /mnt/build
            cd "/mnt/build/$1"
          }
          EOF
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: sources
          path: /mnt/src
          retention-days: 1
          compression-level: 0

  # ---------------------------------------------------------------- 2) çapraz toolchain
  toolchain:
    needs: sources
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Hazırlık
        run: |
          sudo mkdir -p /mnt/src /mnt/lfs /mnt/build
          sudo chown "$USER" /mnt/src /mnt/lfs /mnt/build
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bison flex gawk texinfo m4 zstd xz-utils patch
          sudo ln -sf bash /bin/sh

      - uses: actions/download-artifact@v4
        with:
          name: sources
          path: /mnt/src

      - name: binutils, gcc, linux headers, glibc, libstdc++ (LFS bölüm 5)
        run: |
          . /mnt/src/helpers.sh
          mkdir -pv $LFS/{etc,var,lib64,tools} $LFS/usr/{bin,lib,sbin}
          for i in bin lib sbin; do ln -sfv usr/$i $LFS/$i; done

          # --- binutils pass 1
          ( unpack binutils-2.44
            mkdir build; cd build
            ../configure --prefix=$LFS/tools --with-sysroot=$LFS --target=$LFS_TGT \
              --disable-nls --enable-gprofng=no --disable-werror \
              --enable-new-dtags --enable-default-hash-style=gnu
            make
            make install
          )

          # --- gcc pass 1
          ( unpack gcc-14.2.0
            tar -xf $SRC/mpfr-4.2.1.tar.xz; mv mpfr-4.2.1 mpfr
            tar -xf $SRC/gmp-6.3.0.tar.xz;  mv gmp-6.3.0 gmp
            tar -xf $SRC/mpc-1.3.1.tar.gz;  mv mpc-1.3.1 mpc
            sed -e '/m64=/s/lib64/lib/' -i.orig gcc/config/i386/t-linux64
            mkdir build; cd build
            ../configure --target=$LFS_TGT --prefix=$LFS/tools \
              --with-glibc-version=2.41 --with-sysroot=$LFS --with-newlib --without-headers \
              --enable-default-pie --enable-default-ssp --disable-nls --disable-shared \
              --disable-multilib --disable-threads --disable-libatomic --disable-libgomp \
              --disable-libquadmath --disable-libssp --disable-libvtv --disable-libstdcxx \
              --enable-languages=c,c++
            make
            make install
            cd ..
            cat gcc/limitx.h gcc/glimits.h gcc/limity.h > \
              "$(dirname "$($LFS_TGT-gcc -print-libgcc-file-name)")/include/limits.h"
          )

          # --- Linux API headers
          ( unpack linux-6.13.4
            make mrproper
            make headers
            find usr/include -type f ! -name '*.h' -delete
            cp -rv usr/include $LFS/usr
          )

          # --- glibc
          ( unpack glibc-2.41
            ln -sfv ../lib/ld-linux-x86-64.so.2 $LFS/lib64/ld-linux-x86-64.so.2
            ln -sfv ../lib/ld-linux-x86-64.so.2 $LFS/lib64/ld-lsb-x86-64.so.3
            mkdir build; cd build
            echo "rootsbindir=/usr/sbin" > configparms
            ../configure --prefix=/usr --host=$LFS_TGT --build=$(../scripts/config.guess) \
              --enable-kernel=5.4 --with-headers=$LFS/usr/include --disable-nscd \
              libc_cv_slibdir=/usr/lib
            make
            make DESTDIR=$LFS install
            sed '/RTLDLIST=/s@/usr@@g' -i $LFS/usr/bin/ldd
          )

          # sağlama
          echo 'int main(){}' | $LFS_TGT-gcc -xc - -o /tmp/a.out
          readelf -l /tmp/a.out | grep -q 'ld-linux-x86-64.so.2'

          # --- libstdc++ (gcc kaynağından)
          ( unpack gcc-14.2.0
            mkdir build; cd build
            ../libstdc++-v3/configure --host=$LFS_TGT --build=$(../config.guess) --prefix=/usr \
              --disable-multilib --disable-nls --disable-libstdcxx-pch \
              --with-gxx-include-dir=/tools/$LFS_TGT/include/c++/14.2.0
            make
            make DESTDIR=$LFS install
            rm -v $LFS/usr/lib/lib{stdc++{,exp,fs},supc++}.la
          )

      - name: Paketle
        run: |
          sudo tar --numeric-owner -I 'zstd -T0 -3' -cpf /mnt/toolchain.tar.zst -C "$LFS" .
          ls -lh /mnt/toolchain.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: toolchain
          path: /mnt/toolchain.tar.zst
          retention-days: 1
          compression-level: 0

  # ---------------------------------------------------------------- 3) geçici araçlar
  temp-tools:
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Hazırlık
        run: |
          sudo mkdir -p /mnt/src /mnt/lfs /mnt/build /mnt/dl
          sudo chown "$USER" /mnt/src /mnt/lfs /mnt/build /mnt/dl
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bison flex gawk texinfo m4 zstd xz-utils patch
          sudo ln -sf bash /bin/sh

      - uses: actions/download-artifact@v4
        with:
          name: sources
          path: /mnt/src
      - uses: actions/download-artifact@v4
        with:
          name: toolchain
          path: /mnt/dl

      - name: Toolchain'i aç
        run: |
          sudo tar --numeric-owner -I zstd -xpf /mnt/dl/toolchain.tar.zst -C "$LFS"
          sudo chown -R "$USER" "$LFS"
          rm -f /mnt/dl/toolchain.tar.zst

      - name: Geçici araçlar (LFS bölüm 6)
        run: |
          . /mnt/src/helpers.sh
          GUESS() { ./config.guess 2>/dev/null || ./build-aux/config.guess; }

          ( unpack m4-1.4.19
            ./configure --prefix=/usr --host=$LFS_TGT --build=$(build-aux/config.guess)
            make
            make DESTDIR=$LFS install )

          ( unpack ncurses-6.5
            sed -i s/mawk// configure
            mkdir build
            ( cd build
              ../configure AWK=gawk
              make -C include
              make -C progs tic )
            ./configure --prefix=/usr --host=$LFS_TGT --build=$(./config.guess) \
              --mandir=/usr/share/man --with-manpage-format=normal --with-shared \
              --without-normal --with-cxx-shared --without-debug --without-ada \
              --disable-stripping AWK=gawk
            make
            make DESTDIR=$LFS TIC_PATH=$(pwd)/build/progs/tic install
            ln -sv libncursesw.so $LFS/usr/lib/libncurses.so
            sed -e 's/^#if.*XOPEN.*$/#if 1/' -i $LFS/usr/include/curses.h )

          ( unpack bash-5.2.37
            ./configure --prefix=/usr --build=$(sh support/config.guess) --host=$LFS_TGT --without-bash-malloc
            make
            make DESTDIR=$LFS install
            ln -sv bash $LFS/bin/sh )

          ( unpack coreutils-9.6
            ./configure --prefix=/usr --host=$LFS_TGT --build=$(build-aux/config.guess) \
              --enable-install-program=hostname --enable-no-install-program=kill,uptime
            make
            make DESTDIR=$LFS install
            mv -v $LFS/usr/bin/chroot $LFS/usr/sbin )

          ( unpack diffutils-3.11
            ./configure --prefix=/usr --host=$LFS_TGT --build=$(./build-aux/config.guess)
            make
            make DESTDIR=$LFS install )

          ( unpack file-5.46
            mkdir build
            ( cd build
              ../configure --disable-bzlib --disable-libseccomp --disable-xzlib --disable-zlib
              make )
            ./configure --prefix=/usr --host=$LFS_TGT --build=$(./config.guess)
            make FILE_COMPILE=$(pwd)/build/src/file
            make DESTDIR=$LFS install
            rm -v $LFS/usr/lib/libmagic.la )

          ( unpack findutils-4.10.0
            ./configure --prefix=/usr --localstatedir=/var/lib/locate --host=$LFS_TGT --build=$(build-aux/config.guess)
            make
            make DESTDIR=$LFS install )

          ( unpack gawk-5.3.1
            sed -i 's/extras//' Makefile.in
            ./configure --prefix=/usr --host=$LFS_TGT --build=$(build-aux/config.guess)
            make
            make DESTDIR=$LFS install )

          ( unpack grep-3.11
            ./configure --prefix=/usr --host=$LFS_TGT --build=$(./build-aux/config.guess)
            make
            make DESTDIR=$LFS install )

          ( unpack gzip-1.13
            ./configure --prefix=/usr --host=$LFS_TGT
            make
            make DESTDIR=$LFS install )

          ( unpack make-4.4.1
            ./configure --prefix=/usr --without-guile --host=$LFS_TGT --build=$(build-aux/config.guess)
            make
            make DESTDIR=$LFS install )

          ( unpack patch-2.7.6
            ./configure --prefix=/usr --host=$LFS_TGT --build=$(build-aux/config.guess)
            make
            make DESTDIR=$LFS install )

          ( unpack sed-4.9
            ./configure --prefix=/usr --host=$LFS_TGT --build=$(./build-aux/config.guess)
            make
            make DESTDIR=$LFS install )

          ( unpack tar-1.35
            ./configure --prefix=/usr --host=$LFS_TGT --build=$(build-aux/config.guess)
            make
            make DESTDIR=$LFS install )

          ( unpack xz-5.6.4
            ./configure --prefix=/usr --host=$LFS_TGT --build=$(build-aux/config.guess) \
              --disable-static --docdir=/usr/share/doc/xz-5.6.4
            make
            make DESTDIR=$LFS install
            rm -v $LFS/usr/lib/liblzma.la )

          # --- binutils pass 2
          ( unpack binutils-2.44
            sed '6009s/$add_dir//' -i ltmain.sh
            mkdir build; cd build
            ../configure --prefix=/usr --build=$(../config.guess) --host=$LFS_TGT \
              --disable-nls --enable-shared --enable-gprofng=no --disable-werror \
              --enable-64-bit-bfd --enable-new-dtags --enable-default-hash-style=gnu
            make
            make DESTDIR=$LFS install
            rm -v $LFS/usr/lib/lib{bfd,ctf,ctf-nobfd,opcodes,sframe}.{a,la} )

          # --- gcc pass 2 (artık sistemde yerel gcc/g++ olacak)
          ( unpack gcc-14.2.0
            tar -xf $SRC/mpfr-4.2.1.tar.xz; mv mpfr-4.2.1 mpfr
            tar -xf $SRC/gmp-6.3.0.tar.xz;  mv gmp-6.3.0 gmp
            tar -xf $SRC/mpc-1.3.1.tar.gz;  mv mpc-1.3.1 mpc
            sed -e '/m64=/s/lib64/lib/' -i.orig gcc/config/i386/t-linux64
            sed '/thread_header =/s/@.*@/gthr-posix.h/' -i libgcc/Makefile.in libstdc++-v3/include/Makefile.in
            mkdir build; cd build
            ../configure --build=$(../config.guess) --host=$LFS_TGT --target=$LFS_TGT \
              LDFLAGS_FOR_TARGET=-L$PWD/$LFS_TGT/libgcc \
              --prefix=/usr --with-build-sysroot=$LFS --enable-default-pie --enable-default-ssp \
              --disable-nls --disable-multilib --disable-libatomic --disable-libgomp \
              --disable-libquadmath --disable-libsanitizer --disable-libssp --disable-libvtv \
              --enable-languages=c,c++
            make
            make DESTDIR=$LFS install
            ln -sv gcc $LFS/usr/bin/cc )

      - name: Paketle
        run: |
          sudo tar --numeric-owner -I 'zstd -T0 -3' -cpf /mnt/temptools.tar.zst -C "$LFS" .
          ls -lh /mnt/temptools.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: temptools
          path: /mnt/temptools.tar.zst
          retention-days: 1
          compression-level: 0

  # ---------------------------------------------------------------- 4) chroot: nihai sistem
  final:
    needs: temp-tools
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Hazırlık
        run: |
          sudo mkdir -p /mnt/src /mnt/lfs /mnt/dl
          sudo chown "$USER" /mnt/src /mnt/lfs /mnt/dl
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd xz-utils ca-certificates

      - uses: actions/download-artifact@v4
        with:
          name: sources
          path: /mnt/src
      - uses: actions/download-artifact@v4
        with:
          name: temptools
          path: /mnt/dl

      - name: Aç ve chroot hazırla
        run: |
          sudo tar --numeric-owner -I zstd -xpf /mnt/dl/temptools.tar.zst -C "$LFS"
          rm -f /mnt/dl/temptools.tar.zst
          sudo cp -r /mnt/src "$LFS/sources"
          sudo chown -R root:root $LFS/{usr,lib,var,etc,bin,sbin,tools,lib64,sources}
          sudo mkdir -pv $LFS/{dev,proc,sys,run}
          # CA sertifikaları (xbps https için)
          sudo mkdir -p $LFS/etc/ssl
          sudo cp /etc/ssl/certs/ca-certificates.crt $LFS/etc/ssl/cert.pem

      - name: Chroot içinde derle (araçlar + temel sistem)
        env:
          ROOT_PASSWORD: ${{ inputs.root_password }}
        run: |
          cat > /tmp/stage.sh <<'EOF'
          #!/bin/bash
          set -euo pipefail
          export MAKEFLAGS="-j${NPROC}" MAKEINFO=true
          export PATH=/usr/bin:/usr/sbin
          mkdir -p /build
          unpack() {
            local f
            f=$(ls /sources/$1.tar.* | head -n1)
            find /build -mindepth 1 -delete
            tar -xf "$f" -C /build
            cd "/build/$1"
          }

          # ---------- dizin yapısı
          mkdir -pv /{boot,home,mnt,opt,srv}
          mkdir -pv /etc/{opt,sysconfig}
          mkdir -pv /lib/firmware /media/{floppy,cdrom}
          mkdir -pv /usr/{,local/}{include,src}
          mkdir -pv /usr/lib/locale /usr/local/{bin,lib,sbin}
          mkdir -pv /usr/{,local/}share/{color,dict,doc,info,locale,man}
          mkdir -pv /usr/{,local/}share/{misc,terminfo,zoneinfo}
          mkdir -pv /usr/{,local/}share/man/man{1..8}
          mkdir -pv /var/{cache,local,log,mail,opt,spool}
          mkdir -pv /var/lib/{color,misc,locate}
          ln -sfv /run /var/run
          ln -sfv /run/lock /var/lock
          install -dv -m 0750 /root
          install -dv -m 1777 /tmp /var/tmp
          ln -sfv /proc/self/mounts /etc/mtab

          cat > /etc/hosts <<"EOT"
          127.0.0.1  localhost lfs-openrc
          ::1        localhost
          EOT
          cat > /etc/passwd <<"EOT"
          root:x:0:0:root:/root:/bin/bash
          bin:x:1:1:bin:/dev/null:/usr/bin/false
          daemon:x:6:6:Daemon User:/dev/null:/usr/bin/false
          nobody:x:65534:65534:Unprivileged User:/dev/null:/usr/bin/false
          EOT
          cat > /etc/group <<"EOT"
          root:x:0:
          bin:x:1:daemon
          sys:x:2:
          kmem:x:3:
          tape:x:4:
          tty:x:5:
          daemon:x:6:
          floppy:x:7:
          disk:x:8:
          lp:x:9:
          dialout:x:10:
          audio:x:11:
          video:x:12:
          utmp:x:13:
          cdrom:x:15:
          adm:x:16:
          input:x:24:
          mail:x:34:
          kvm:x:61:
          users:x:999:
          nogroup:x:65534:
          EOT
          touch /var/log/{btmp,lastlog,faillog,wtmp}
          chgrp -v utmp /var/log/lastlog
          chmod -v 664 /var/log/lastlog
          chmod -v 600 /var/log/btmp

          # ---------- Perl
          ( unpack perl-5.40.1
            sh Configure -des -D prefix=/usr -D vendorprefix=/usr -D useshrplib \
              -D privlib=/usr/lib/perl5/5.40/core_perl -D archlib=/usr/lib/perl5/5.40/core_perl \
              -D sitelib=/usr/lib/perl5/5.40/site_perl -D sitearch=/usr/lib/perl5/5.40/site_perl \
              -D vendorlib=/usr/lib/perl5/5.40/vendor_perl -D vendorarch=/usr/lib/perl5/5.40/vendor_perl
            make
            make install )

          # ---------- pkgconf, zlib, zstd, libxcrypt
          ( unpack pkgconf-2.3.0
            ./configure --prefix=/usr --disable-static
            make
            make install
            ln -sfv pkgconf /usr/bin/pkg-config )

          ( unpack zlib-1.3.1
            ./configure --prefix=/usr
            make
            make install
            rm -fv /usr/lib/libz.a )

          ( unpack zstd-1.5.7
            make prefix=/usr
            make prefix=/usr install
            rm -fv /usr/lib/libzstd.a )

          ( unpack libxcrypt-4.4.38
            ./configure --prefix=/usr --enable-hashes=strong,glibc --enable-obsolete-api=no \
              --disable-static --disable-failure-tokens
            make
            make install )

          # ---------- xbps bağımlılıkları: libressl + libarchive
          ( unpack libressl-3.9.2
            ./configure --prefix=/usr --disable-static
            make
            make install )

          ( unpack libarchive-3.7.7
            ./configure --prefix=/usr --disable-static --disable-bsdtar --disable-bsdcat \
              --disable-bsdcpio --disable-bsdunzip --without-openssl --without-xml2 \
              --without-expat --without-nettle --without-lzo2 --without-bz2lib \
              --without-lz4 --without-libb2 --with-zstd --with-lzma
            make
            make install )

          ldconfig

          # ---------- xbps (paket yöneticisi)
          ( unpack xbps-0.59.2
            CFLAGS="-O2 -Wno-error" ./configure --prefix=/usr --sysconfdir=/etc
            make
            make install )

          # ---------- temel sistem
          ( unpack util-linux-2.40.4
            mkdir -pv /var/lib/hwclock
            ./configure --libdir=/usr/lib --runstatedir=/run --disable-chfn-chsh --disable-login \
              --disable-nologin --disable-su --disable-setpriv --disable-runuser \
              --disable-pylibmount --disable-static --disable-liblastlog2 --disable-nls \
              --without-python ADJTIME_PATH=/var/lib/hwclock/adjtime
            make
            make install )

          ( unpack e2fsprogs-1.47.2
            mkdir build; cd build
            ../configure --prefix=/usr --sysconfdir=/etc --enable-elf-shlibs --disable-libblkid \
              --disable-libuuid --disable-uuidd --disable-fsck --disable-nls
            make
            make install
            rm -fv /usr/lib/{libcom_err,libe2p,libext2fs,libss}.a )

          ( unpack shadow-4.17.3
            sed -e 's:#ENCRYPT_METHOD DES:ENCRYPT_METHOD YESCRYPT:' \
                -e 's:/var/spool/mail:/var/mail:' \
                -e '/PATH=/{s@/sbin:@@;s@/bin:@@}' -i etc/login.defs
            ./configure --sysconfdir=/etc --disable-static --with-{b,yes}crypt --without-libbsd \
              --with-group-name-max-length=32 --disable-nls
            make
            make exec_prefix=/usr install )
          pwconv
          grpconv
          mkdir -p /etc/default
          useradd -D --gid 999
          sed -i '/MAIL/s/yes/no/' /etc/default/useradd
          echo "root:${ROOT_PASSWORD}" | chpasswd

          ( unpack procps-ng-4.0.5
            NCURSES_CFLAGS="" NCURSES_LIBS="-lncursesw" \
            ./configure --prefix=/usr --disable-static --disable-kill --disable-nls
            make
            make install )

          ( unpack inetutils-2.6
            ./configure --prefix=/usr --bindir=/usr/bin --localstatedir=/var --disable-logger \
              --disable-whois --disable-rcp --disable-rexec --disable-rlogin --disable-rsh \
              --disable-servers --disable-nls
            make
            make install )

          ( unpack sysvinit-3.14
            make
            make install )

          ( unpack openrc-0.45.2
            make MKPAM=no MKSELINUX=no MKAUDIT=no
            make MKPAM=no MKSELINUX=no MKAUDIT=no install )

          ( unpack dhcpcd-10.1.0
            ./configure --prefix=/usr --sysconfdir=/etc --dbdir=/var/lib/dhcpcd \
              --libexecdir=/usr/lib/dhcpcd --disable-privsep
            make
            make install )

          ( unpack nano-8.3
            ./configure --prefix=/usr --sysconfdir=/etc --enable-utf8 --disable-nls
            make
            make install )

          ldconfig

          # ---------- yapılandırma: init (sysvinit + OpenRC)
          cat > /etc/inittab <<"EOT"
          id:3:initdefault:
          mnt::sysinit:/bin/mount -t tmpfs -o mode=0755,nosuid,nodev tmpfs /run
          si::sysinit:/sbin/openrc sysinit
          rc::bootwait:/sbin/openrc boot
          l0:0:wait:/sbin/openrc shutdown
          l0s:0:wait:/sbin/halt -dhp
          l1:1:wait:/sbin/openrc single
          l2:2:wait:/sbin/openrc nonetwork
          l3:3:wait:/sbin/openrc default
          l4:4:wait:/sbin/openrc default
          l5:5:wait:/sbin/openrc default
          l6:6:wait:/sbin/openrc reboot
          l6r:6:wait:/sbin/reboot -dk
          su0:S:wait:/sbin/openrc single
          su1:S:wait:/sbin/sulogin
          c1:12345:respawn:/sbin/agetty 38400 tty1 linux
          s0:12345:respawn:/sbin/agetty -L 115200 ttyS0 vt100
          ca:12345:ctrlaltdel:/sbin/shutdown -r now
          EOT

          mkdir -p /etc/runlevels/{boot,default,sysinit,shutdown,nonetwork}
          rm -f /etc/runlevels/*/{keymaps,modules,termencoding}

          cat > /etc/init.d/dhcpcd <<"EOT"
          #!/sbin/openrc-run
          description="dhcpcd DHCP istemcisi"
          command=/usr/sbin/dhcpcd
          command_args="-B"
          command_background=true
          pidfile=/run/dhcpcd-openrc.pid
          depend() {
            need localmount
            provide net
          }
          EOT
          chmod +x /etc/init.d/dhcpcd
          ln -sf /etc/init.d/dhcpcd /etc/runlevels/default/dhcpcd

          echo 'hostname="lfs-openrc"' > /etc/conf.d/hostname
          echo lfs-openrc > /etc/hostname
          touch /etc/sysctl.conf

          cat > /etc/fstab <<"EOT"
          LABEL=rootfs  /          ext4    defaults,noatime  0 1
          devpts        /dev/pts   devpts  gid=5,mode=620    0 0
          tmpfs         /dev/shm   tmpfs   nosuid,nodev      0 0
          EOT

          cat > /etc/profile <<"EOT"
          export PATH=/usr/local/bin:/usr/bin:/usr/sbin
          export PS1='\u@\h:\w\$ '
          export EDITOR=nano
          EOT
          printf '/bin/sh\n/bin/bash\n' > /etc/shells
          printf '/usr/local/lib\n' > /etc/ld.so.conf

          cat > /etc/os-release <<"EOT"
          NAME="LFS OpenRC"
          ID=lfs
          VERSION_ID="12.3-openrc"
          PRETTY_NAME="LFS 12.3 (glibc, OpenRC, xbps)"
          EOT
          cp /etc/os-release /usr/lib/os-release

          # xbps depo örneği (glibc binary uyumu garanti DEĞİL, istersen aç)
          mkdir -p /etc/xbps.d
          cat > /etc/xbps.d/00-repository-main.conf.example <<"EOT"
          # repository=https://repo-default.voidlinux.org/current
          EOT

          # ---------- temizlik
          rm -rf /tools /usr/share/{info,man,doc}/*
          find /usr/lib /usr/libexec -name '*.la' -delete 2>/dev/null || true
          rm -rf /build /sources /tmp/*
          EOF
          sudo cp /tmp/stage.sh "$LFS/stage.sh"

          # bind mount'lar
          sudo mount --bind /dev "$LFS/dev"
          sudo mount -t devpts devpts -o gid=5,mode=0620 "$LFS/dev/pts"
          sudo mount -t proc proc "$LFS/proc"
          sudo mount -t sysfs sysfs "$LFS/sys"
          sudo mount -t tmpfs tmpfs "$LFS/run"
          sudo mount -t tmpfs -o nosuid,nodev tmpfs "$LFS/dev/shm"

          sudo chroot "$LFS" /usr/bin/env -i HOME=/root TERM=xterm \
            PATH=/usr/bin:/usr/sbin NPROC="$(nproc)" ROOT_PASSWORD="$ROOT_PASSWORD" \
            /bin/bash /stage.sh
          sudo rm -f "$LFS/stage.sh"

      - name: Mount'ları kaldır
        if: always()
        run: |
          for m in dev/shm dev/pts dev proc sys run; do
            sudo umount -l "$LFS/$m" 2>/dev/null || true
          done

      - name: Rootfs paketle
        run: |
          sudo tar --numeric-owner -I 'zstd -T0 -10' -cpf /mnt/rootfs.tar.zst -C "$LFS" .
          ls -lh /mnt/rootfs.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: rootfs
          path: /mnt/rootfs.tar.zst
          retention-days: 3
          compression-level: 0

  # ---------------------------------------------------------------- 4b) çekirdek (paralel)
  kernel:
    needs: sources
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Hazırlık
        run: |
          sudo chown "$USER" /mnt
          sudo mkdir -p /mnt/src /mnt/build
          sudo chown "$USER" /mnt/src /mnt/build
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc flex bison libelf-dev libssl-dev xz-utils

      - uses: actions/download-artifact@v4
        with:
          name: sources
          path: /mnt/src

      - name: Çekirdeği derle
        run: |
          . /mnt/src/helpers.sh
          unpack linux-6.13.4
          make defconfig kvm_guest.config
          ./scripts/config \
            -e DEVTMPFS -e DEVTMPFS_MOUNT -e EXT4_FS -e TMPFS -e DEVPTS_FS \
            -e SERIAL_8250 -e SERIAL_8250_CONSOLE \
            -e VIRTIO_BLK -e VIRTIO_PCI -e VIRTIO_NET -e SCSI_VIRTIO \
            -e ATA -e SATA_AHCI -e ATA_PIIX -e BLK_DEV_NVME \
            -e E1000 -e E1000E -e R8169 \
            -e USB_XHCI_HCD -e USB_XHCI_PCI -e USB_STORAGE
          make olddefconfig
          make bzImage
          cp arch/x86/boot/bzImage /mnt/vmlinuz-6.13.4

      - uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: /mnt/vmlinuz-6.13.4
          retention-days: 3
          compression-level: 0

  # ---------------------------------------------------------------- 5) disk imajı + test + release
  image:
    needs: [final, kernel]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      IMAGE_SIZE: ${{ inputs.image_size }}
    steps:
      - name: Hazırlık
        run: |
          sudo chown "$USER" /mnt
          sudo mkdir -p /mnt/dl /mnt/img
          sudo chown "$USER" /mnt/dl
          sudo apt-get update -qq
          sudo apt-get install -y -qq grub-pc-bin grub2-common parted e2fsprogs zstd

      - uses: actions/download-artifact@v4
        with:
          name: rootfs
          path: /mnt/dl
      - uses: actions/download-artifact@v4
        with:
          name: kernel
          path: /mnt/dl

      - name: Bootable BIOS imajı oluştur
        run: |
          cd /mnt
          IMG=/mnt/lfs-openrc-x86_64.img
          truncate -s "$IMAGE_SIZE" "$IMG"
          printf 'label: dos\nlabel-id: 0x4c465321\n,,L,*\n' | sfdisk "$IMG"
          LOOP=$(sudo losetup --find --show -P "$IMG")
          sudo partprobe "$LOOP" || true
          sleep 1
          sudo mkfs.ext4 -q -F -L rootfs "${LOOP}p1"
          sudo mount "${LOOP}p1" /mnt/img
          sudo tar --numeric-owner -I zstd -xpf /mnt/dl/rootfs.tar.zst -C /mnt/img
          sudo install -Dm644 /mnt/dl/vmlinuz-6.13.4 /mnt/img/boot/vmlinuz-6.13.4

          sudo mkdir -p /mnt/img/boot/grub
          sudo tee /mnt/img/boot/grub/grub.cfg >/dev/null <<'EOT'
          set timeout=2
          serial --unit=0 --speed=115200
          terminal_input serial console
          terminal_output serial console
          menuentry "LFS OpenRC" {
            insmod part_msdos
            insmod ext2
            search --no-floppy --label rootfs --set=root
            linux /boot/vmlinuz-6.13.4 root=PARTUUID=4c465321-01 rw console=tty0 console=ttyS0,115200
          }
          EOT
          sudo grub-install --target=i386-pc --boot-directory=/mnt/img/boot \
            --modules="part_msdos ext2" "$LOOP"

          sudo umount /mnt/img
          sudo losetup -d "$LOOP"

      - name: QEMU boot testi
        if: ${{ inputs.run_qemu_test }}
        run: |
          sudo apt-get install -y -qq qemu-system-x86
          cd /mnt
          qemu-system-x86_64 -m 1024 -smp 2 -accel kvm -accel tcg \
            -display none -monitor none -serial file:/mnt/boot.log \
            -drive file=/mnt/lfs-openrc-x86_64.img,format=raw,if=virtio \
            -netdev user,id=n0 -device virtio-net-pci,netdev=n0 &
          QPID=$!
          ok=0
          for i in $(seq 1 100); do
            if grep -q "login:" /mnt/boot.log 2>/dev/null; then ok=1; break; fi
            sleep 4
          done
          kill "$QPID" 2>/dev/null || true
          echo "-------- boot.log (son 80 satır) --------"
          tail -n 80 /mnt/boot.log || true
          [ "$ok" = 1 ]

      - name: Sıkıştır + checksum
        run: |
          cd /mnt
          zstd -T0 -10 -q lfs-openrc-x86_64.img -o lfs-openrc-x86_64.img.zst
          cp /mnt/dl/rootfs.tar.zst lfs-openrc-rootfs.tar.zst
          cp /mnt/dl/vmlinuz-6.13.4 vmlinuz-6.13.4
          sha256sum lfs-openrc-x86_64.img.zst lfs-openrc-rootfs.tar.zst vmlinuz-6.13.4 > SHA256SUMS
          ls -lh lfs-openrc-* vmlinuz-* SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: lfs-openrc-x86_64
          path: |
            /mnt/lfs-openrc-x86_64.img.zst
            /mnt/lfs-openrc-rootfs.tar.zst
            /mnt/vmlinuz-6.13.4
            /mnt/SHA256SUMS
          retention-days: 14
          compression-level: 0

      - name: GitHub Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lfs-openrc-${{ github.run_number }}
          name: LFS OpenRC build #${{ github.run_number }}
          files: |
            /mnt/lfs-openrc-x86_64.img.zst
            /mnt/lfs-openrc-rootfs.tar.zst
            /mnt/vmlinuz-6.13.4
            /mnt/SHA256SUMS
